<!-- POP-UP RECHERCHE LOGEMENT -->
<div id="ls-logement" class="ls-logement" role="dialog" aria-label="Avis de recherche logement" aria-hidden="true">
  <button class="ls-logement-close" type="button" aria-label="Fermer">&times;</button>
  <div class="ls-logement-badge">Avis de recherche</div>
  <p class="ls-logement-title">On cherche notre futur <span>chez nous</span>&nbsp;!</p>
  <ul class="ls-logement-crit">
    <li><strong>50 m²</strong> min.</li>
    <li><strong>1 000 €</strong> max</li>
    <li><strong>Lambesc</strong> &amp; alentours</li>
  </ul>
  <p class="ls-logement-txt">Vous entendez parler d'une location&nbsp;? On prend tous les tuyaux&nbsp;!</p>
  <a class="btn-g ls-logement-btn" href="mailto:arl.laspeciale@gmail.com?subject=Un%20tuyau%20logement%20pour%20vous">Nous écrire</a>
</div>

<style>
.ls-logement{
  position:fixed; right:20px; bottom:20px; z-index:99999;
  width:320px; max-width:calc(100% - 32px); box-sizing:border-box;
  background:#1A0A04; color:#fff;
  border:1px solid rgba(201,168,76,.45); border-radius:18px;
  padding:22px 22px 20px;
  box-shadow:0 18px 50px rgba(0,0,0,.45);
  font-family:'DM Sans',sans-serif;
  transform:translateY(140%); opacity:0; visibility:hidden;
  transition:transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s, visibility .5s;
}
.ls-logement.is-open{ transform:translateY(0); opacity:1; visibility:visible; }
.ls-logement-close{
  position:absolute; top:8px; right:10px;
  width:36px; height:36px; border:0; background:transparent;
  color:#C9A84C; font-size:26px; line-height:1; cursor:pointer; border-radius:50%;
}
.ls-logement-close:hover{ background:rgba(201,168,76,.15); }
.ls-logement-badge{
  display:inline-block; background:#C9A84C; color:#1A0A04;
  font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
  padding:5px 12px; border-radius:999px; margin-bottom:12px;
}
.ls-logement-title{
  font-family:'Playfair Display',serif; font-size:24px; line-height:1.15;
  margin:0 0 14px; color:#fff; padding-right:20px;
}
.ls-logement-title span{ color:#C9A84C; font-style:italic; }
.ls-logement-crit{
  list-style:none; margin:0 0 14px; padding:0;
  display:flex; flex-wrap:wrap; gap:6px;
}
.ls-logement-crit li{
  margin:0; font-size:13px; color:#f1e6d8;
  border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:5px 10px;
}
.ls-logement-crit strong{ color:#fff; }
.ls-logement-txt{ font-size:14px; line-height:1.45; margin:0 0 16px; color:#e9ddd0; }
.ls-logement-btn{
  display:block; text-align:center; text-decoration:none;
  background:#C0392B; color:#fff !important; font-weight:700; font-size:15px;
  padding:12px 16px; border-radius:999px; transition:background .2s;
}
.ls-logement-btn:hover{ background:#a93226; }
.btn-g:hover{ color:#fff !important; }
@media (max-width:600px){
  .ls-logement{ right:16px; left:16px; bottom:16px; width:auto; max-width:none; }
}
</style>

<script>
(function(){
  var KEY='ls_logement_ferme', JOURS=3, box=document.getElementById('ls-logement');
  if(!box) return;
  if(box.parentNode!==document.body) document.body.appendChild(box);
  try{
    var t=localStorage.getItem(KEY);
    if(t && Date.now()-parseInt(t,10) < JOURS*864e5) return;
  }catch(e){}
  setTimeout(function(){
    box.classList.add('is-open'); box.setAttribute('aria-hidden','false');
  },5000);
  box.querySelector('.ls-logement-close').addEventListener('click',function(){
    box.classList.remove('is-open'); box.setAttribute('aria-hidden','true');
    try{ localStorage.setItem(KEY,Date.now()); }catch(e){}
  });
})();
</script>
